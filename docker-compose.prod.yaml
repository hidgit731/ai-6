services:

  nginx:
    restart: unless-stopped
    volumes:
      - ./deploy/prod/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  postgres:
    restart: unless-stopped
    ports: []

  backend_monolith:
    build:
      context: ./backend_monolith/deploy/prod
    restart: unless-stopped
    volumes: []

  frontend:
    build:
      context: ./frontend/deploy/prod
    restart: unless-stopped
    volumes: []
